<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ai-os">
  <title>ai-os — four buckets of time, and the one nothing has been written into yet</title>
  <!-- The mark is cut from the demo's own primitive: on the activity canvas a
       square is one flow in one bucket of time, and a bucket with nothing
       recorded in it is drawn as an outline rather than as a zero — because
       "nothing was written down" and "nothing happened" are different claims and
       only the first is ours to make. Three recorded, one open. That sentence is
       the whole project, and it is four rectangles. -->
  <rect x="2"  y="2"  width="13" height="13" rx="4" fill="currentColor"/>
  <rect x="17" y="2"  width="13" height="13" rx="4" fill="currentColor"/>
  <rect x="2"  y="17" width="13" height="13" rx="4" fill="currentColor"/>
  <rect x="18" y="18" width="11" height="11" rx="3" fill="none"
        stroke="currentColor" stroke-width="2" opacity=".42"/>
</svg>
